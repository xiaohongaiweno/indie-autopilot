# Workflow execution policy
#
# NOTE: the gates that are actually enforced live in scripts/state_machine.py
# (TransitionConfig.approval_required / .gate). This file supplies the gate
# *metadata* used to render the approval prompt (description, risk_level,
# requires) and the per-stage timeout the orchestrator passes to the adapter.
# The `auto_advance` / `approval_required` / `approval_gate` fields below are
# descriptive documentation of the intended layout -- keep them in step with
# state_machine.py, but do not expect them to gate anything on their own.

stages:
  discovery:
    auto_advance: true
    approval_required: false
    timeout_minutes: 30
    retry_limit: 2

  research:
    auto_advance: true
    approval_required: false
    timeout_minutes: 60
    retry_limit: 2

  validation:
    auto_advance: false
    approval_required: true
    approval_gate: "before_design"            # gate on leaving validation
    timeout_minutes: 60
    retry_limit: 1

  planning:
    auto_advance: false
    approval_required: true
    approval_gate: "before_mvp_commit"        # gate on leaving planning
    timeout_minutes: 45
    retry_limit: 1

  building:
    auto_advance: true                        # building -> testing is automatic
    approval_required: false
    timeout_minutes: 120
    retry_limit: 2

  testing:
    auto_advance: false
    approval_required: true
    approval_gate: "before_code_merge"        # gate on leaving testing
    timeout_minutes: 30
    retry_limit: 3

  release:
    auto_advance: false
    approval_required: true
    approval_gate: "before_production_release"
    timeout_minutes: 60
    retry_limit: 1
    production_allowed: false

  growth:
    auto_advance: true
    approval_required: false
    timeout_minutes: 30
    retry_limit: 2

approval_gates:
  before_design:
    description: "After validation passed, before investing design and MVP-scoping time"
    requires: ["validation_result"]
    risk_level: "medium"

  before_mvp_commit:
    description: "Before committing to MVP scope, budget, and timeline"
    requires: ["validation_result", "positioning_draft"]
    risk_level: "medium"

  before_code_merge:
    description: "Code review: after tests pass, before the release path"
    requires: ["test_result", "security_review"]
    risk_level: "high"

  before_production_release:
    description: "Before deploying to production environment"
    requires: ["release_checklist", "rollback_plan"]
    risk_level: "critical"
    production_allowed: false

  before_paid_service:
    description: "Before activating any paid service or increasing budget"
    requires: ["cost_estimate", "budget_approval"]
    risk_level: "high"

concurrency:
  max_parallel_runs_per_project: 1
  cancel_in_progress: false
