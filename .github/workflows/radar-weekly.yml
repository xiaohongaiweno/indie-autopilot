name: "Radar: Weekly Opportunity Scan"
on:
  schedule:
    - cron: "0 9 * * 1"  # Monday 9am UTC
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID to update (or 'new' for new opportunities)"
        required: false
        default: "new"
      mock_mode:
        description: "Use mock data sources"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: radar-${{ github.event.inputs.project_id || 'weekly' }}
  cancel-in-progress: false

jobs:
  validate-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_environment.py

  discover:
    needs: validate-env
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run mock discovery
        run: |
          python adapters/mock_agent.py \
            --stage discovery \
            --project-id "${{ github.event.inputs.project_id || 'weekly-scan' }}" \
            --output-dir "projects/${{ github.event.inputs.project_id || 'weekly-scan' }}/research/"
      - name: Validate output
        run: |
          python scripts/validate_artifact.py \
            --schema schemas/stage-result.schema.json \
            --artifact "projects/${{ github.event.inputs.project_id || 'weekly-scan' }}/research/mock-discovery-result.json"
      - name: Generate report
        run: python scripts/generate_report.py --project-dir "projects/${{ github.event.inputs.project_id || 'weekly-scan' }}" --output "projects/${{ github.event.inputs.project_id || 'weekly-scan' }}/research/report.md"
      - name: Create PR with results
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "radar: discovery results for ${{ github.event.inputs.project_id || 'weekly-scan' }}"
          title: "Radar: Discovery Results"
          body: "Automated discovery scan. Review results before proceeding."
          branch: "radar/${{ github.event.inputs.project_id || 'weekly' }}-${{ github.run_id }}"
          labels: "radar,discovery"

  on-failure:
    needs: [validate-env, discover]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Radar workflow failed. Check logs for details."
      - name: Create diagnostic issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Radar workflow failed',
              body: `Workflow run ${context.runId} failed. Check logs.`,
              labels: ['bug', 'automation']
            });
