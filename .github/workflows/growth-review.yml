name: "Growth: Weekly Review"
on:
  schedule:
    - cron: "0 9 * * 5"  # Friday 9am UTC
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID to review"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: growth-${{ github.event.inputs.project_id || 'weekly' }}
  cancel-in-progress: false

jobs:
  validate-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_environment.py

  check-sources:
    needs: validate-env
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Verify data source configuration
        run: |
          python -c "
          import yaml, sys
          with open('config/sources.yml') as f:
              config = yaml.safe_load(f)
          if not config or 'sources' not in config:
              print('::error::No data sources configured in config/sources.yml')
              sys.exit(1)
          print(f'Found {len(config.get(\"sources\", []))} configured source(s)')
          "

  growth-analysis:
    needs: check-sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run growth analysis
        run: |
          python adapters/mock_agent.py \
            --stage growth \
            --project-id "${{ github.event.inputs.project_id || 'weekly-review' }}" \
            --output-dir "projects/${{ github.event.inputs.project_id || 'weekly-review' }}/growth/"
      - name: Validate output
        run: |
          python scripts/validate_artifact.py \
            --schema schemas/stage-result.schema.json \
            --artifact "projects/${{ github.event.inputs.project_id || 'weekly-review' }}/growth/mock-growth-result.json"
        continue-on-error: true
      - name: Generate growth report
        run: |
          python scripts/generate_report.py \
            --project-dir "projects/${{ github.event.inputs.project_id || 'weekly-review' }}" \
            --output "projects/${{ github.event.inputs.project_id || 'weekly-review' }}/growth/report.md"
      - name: Mark missing data as unavailable
        if: always()
        run: |
          echo "## Data Availability" >> "projects/${{ github.event.inputs.project_id || 'weekly-review' }}/growth/report.md"
          echo "" >> "projects/${{ github.event.inputs.project_id || 'weekly-review' }}/growth/report.md"
          echo "Any data sources that were unavailable during this run have been marked accordingly." >> "projects/${{ github.event.inputs.project_id || 'weekly-review' }}/growth/report.md"
          echo "Review the report and verify critical metrics before acting on recommendations." >> "projects/${{ github.event.inputs.project_id || 'weekly-review' }}/growth/report.md"
      - name: Create PR with growth review results
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "growth: review results for ${{ github.event.inputs.project_id || 'weekly-review' }}"
          title: "Growth: Weekly Review Results"
          body: "Automated growth review. Note: This workflow does NOT auto-submit content to external sites. Review recommendations manually before taking action."
          branch: "growth/${{ github.event.inputs.project_id || 'weekly' }}-${{ github.run_id }}"
          labels: "growth,review"

  on-failure:
    needs: [validate-env, check-sources, growth-analysis]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Growth review workflow failed. Check logs for details."
      - name: Create diagnostic issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Growth review workflow failed',
              body: `Workflow run ${context.runId} failed. Check logs.`,
              labels: ['bug', 'automation']
            });
