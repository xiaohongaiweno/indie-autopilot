name: "Deploy: Cloudflare"
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID to deploy"
        required: true
      environment:
        description: "Deployment environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: write
  issues: write
  deployments: write

concurrency:
  group: deploy-${{ github.event.inputs.project_id }}
  cancel-in-progress: false

jobs:
  pre-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Check transition validity
        run: |
          python scripts/check_transition.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --to-stage release_pending

  deploy:
    needs: pre-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@39370e324d6e2d6e5a3e1b8c3f5c7e8d9a0b1c2d
        with:
          node-version: "20"
      - name: Apply state transition to release_pending
        run: |
          python scripts/apply_transition.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --to-stage release_pending
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT_DIR="projects/${{ github.event.inputs.project_id }}"
          
          # Check if project has wrangler.toml
          if [ -f "$PROJECT_DIR/wrangler.toml" ]; then
            echo "Deploying with wrangler.toml"
            cd "$PROJECT_DIR"
            if [ "${{ github.event.inputs.environment }}" = "production" ]; then
              wrangler deploy --env production
            else
              wrangler deploy
            fi
          else
            echo "No wrangler.toml found. Creating default configuration..."
            mkdir -p "$PROJECT_DIR/dist"
            echo "<h1>${{ github.event.inputs.project_id }}</h1>" > "$PROJECT_DIR/dist/index.html"
            
            cat > "$PROJECT_DIR/wrangler.toml" << 'TOML'
          name = "${{ github.event.inputs.project_id }}"
          main = "src/index.js"
          compatibility_date = "2026-10-10"
          
          [site]
          bucket = "./dist"
          TOML
          
            cd "$PROJECT_DIR"
            if [ "${{ github.event.inputs.environment }}" = "production" ]; then
              wrangler pages deploy dist --project-name="${{ github.event.inputs.project_id }}" --branch=main
            else
              wrangler pages deploy dist --project-name="${{ github.event.inputs.project_id }}"
            fi
          fi
      - name: Apply state transition to launched
        if: github.event.inputs.environment == 'production'
        run: |
          python scripts/apply_transition.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --to-stage launched
      - name: Commit deployment state
        if: github.event.inputs.environment == 'production'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "projects/${{ github.event.inputs.project_id }}/"
          git commit -m "deploy: Launch ${{ github.event.inputs.project_id }} to production" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
      - name: Create release issue
        if: github.event.inputs.environment == 'production'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Launched: ${{ github.event.inputs.project_id }}`,
              body: `## Product Launched!\n\nProject: ${{ github.event.inputs.project_id }}\nEnvironment: Production\n\nThe product has been deployed to Cloudflare and is now live.\n\nNext steps:\n- Monitor analytics and user feedback\n- Plan growth activities\n- Schedule iteration review`,
              labels: ['launch', 'production']
            });

  on-failure:
    needs: [pre-check, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Deploy workflow failed. Check logs for details."
      - name: Create diagnostic issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Deploy workflow failed',
              body: `Workflow run ${context.runId} failed for project ${{ github.event.inputs.project_id }}. Check logs.`,
              labels: ['bug', 'automation']
            });
