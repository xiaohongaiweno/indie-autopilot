name: "Build: Product Implementation"
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID to build"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: build-${{ github.event.inputs.project_id }}
  cancel-in-progress: false

jobs:
  pre-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Check transition validity
        run: |
          python scripts/check_transition.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --to-stage building

  build:
    needs: pre-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Apply state transition to building
        run: |
          python scripts/apply_transition.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --to-stage building
      - name: Run build agent
        run: |
          python adapters/mock_agent.py \
            --stage building \
            --project-id "${{ github.event.inputs.project_id }}" \
            --output-dir "projects/${{ github.event.inputs.project_id }}/build/"
      - name: Validate output
        run: |
          python scripts/validate_artifact.py \
            --schema schemas/stage-result.schema.json \
            --artifact "projects/${{ github.event.inputs.project_id }}/build/mock-building-result.json"
      - name: Generate report
        run: |
          python scripts/generate_report.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --output "projects/${{ github.event.inputs.project_id }}/build/report.md"
      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "projects/${{ github.event.inputs.project_id }}/"
          git commit -m "build: Implementation for ${{ github.event.inputs.project_id }}" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
      - name: Create PR with implementation
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "build: Product implementation for ${{ github.event.inputs.project_id }}"
          title: "Build: Implementation for ${{ github.event.inputs.project_id }}"
          body: "Automated product implementation. Review code and build artifacts before approving."
          branch: "build/${{ github.event.inputs.project_id }}-${{ github.run_id }}"
          labels: "build,implementation"
      - name: Create approval issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Approval needed: Build ${{ github.event.inputs.project_id }}`,
              body: `## Build Results\n\nProject: ${{ github.event.inputs.project_id }}\n\nReview the implementation and approve or request changes.\n\n- [ ] Code quality is acceptable\n- [ ] Tests pass\n- [ ] Documentation is complete\n- [ ] Ready for testing phase\n\nRespond with /approve or /reject`,
              labels: ['approval', 'build']
            });

  on-failure:
    needs: [pre-check, build]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Build workflow failed. Check logs for details."
      - name: Create diagnostic issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Build workflow failed',
              body: `Workflow run ${context.runId} failed for project ${{ github.event.inputs.project_id }}. Check logs.`,
              labels: ['bug', 'automation']
            });
