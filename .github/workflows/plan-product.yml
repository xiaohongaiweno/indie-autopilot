name: "Plan: Product Planning & PRD"
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID to plan"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plan-${{ github.event.inputs.project_id }}
  cancel-in-progress: false

jobs:
  pre-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Check transition validity
        run: |
          python scripts/check_transition.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --to-stage planning

  plan:
    needs: pre-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run planning agent
        run: |
          python adapters/mock_agent.py \
            --stage planning \
            --project-id "${{ github.event.inputs.project_id }}" \
            --output-dir "projects/${{ github.event.inputs.project_id }}/planning/"
      - name: Validate output
        run: |
          python scripts/validate_artifact.py \
            --schema schemas/stage-result.schema.json \
            --artifact "projects/${{ github.event.inputs.project_id }}/planning/mock-planning-result.json"
      - name: Generate report
        run: |
          python scripts/generate_report.py \
            --project-dir "projects/${{ github.event.inputs.project_id }}" \
            --output "projects/${{ github.event.inputs.project_id }}/planning/report.md"
      - name: Create PR with planning artifacts
        if: always()
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a9c830733529  # v7.0.0
        with:
          commit-message: "plan: PRD and task breakdown for ${{ github.event.inputs.project_id }}"
          title: "Plan: PRD & Task Breakdown for ${{ github.event.inputs.project_id }}"
          body: "Automated planning results. Review PRD and task breakdown before approving."
          branch: "plan/${{ github.event.inputs.project_id }}-${{ github.run_id }}"
          labels: "planning,prd"
      - name: Create approval issue
        uses: actions/github-script@60a0d83039c74a4a1b18f8a3f1c5cf06c58a7f1c  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Approval needed: Plan ${{ github.event.inputs.project_id }}`,
              body: `## Planning Results\n\nProject: ${{ github.event.inputs.project_id }}\n\nReview the PRD and task breakdown artifacts and approve or request changes.\n\n- [ ] MVP scope is well-defined\n- [ ] Budget estimate is acceptable\n- [ ] Task breakdown is actionable\n- [ ] Timeline is realistic\n\nRespond with /approve or /reject`,
              labels: ['approval', 'planning']
            });

  on-failure:
    needs: [pre-check, plan]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Plan workflow failed. Check logs for details."
      - name: Create diagnostic issue
        uses: actions/github-script@60a0d83039c74a4a1b18f8a3f1c5cf06c58a7f1c  # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Plan workflow failed',
              body: `Workflow run ${context.runId} failed for project ${{ github.event.inputs.project_id }}. Check logs.`,
              labels: ['bug', 'automation']
            });
