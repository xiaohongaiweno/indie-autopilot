name: "Build & Test"
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      project_id:
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-${{ github.event.inputs.project_id || github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
      - name: Check types (if applicable)
        run: echo "Type checking not yet configured"
      - name: Report results
        if: always()
        run: echo "Build and test complete. Review results above."
